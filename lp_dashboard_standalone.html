<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>LP Price Index Dashboard</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
header { padding: 24px 32px 0; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }
h1 { font-size: 1.5rem; font-weight: 600; color: #f0f6fc; }
h1 span { color: #58a6ff; }
.time-windows { display: flex; gap: 4px; background: #161b22; border-radius: 8px; padding: 3px; }
.time-btn { padding: 6px 14px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer; background: transparent; color: #8b949e; transition: all 0.15s; }
.time-btn:hover { color: #c9d1d9; }
.time-btn.active { background: #1f6feb; color: #fff; }
main { padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 24px; }
.chart-container { background: #161b22; border-radius: 12px; border: 1px solid #21262d; padding: 24px; }
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
.chart-header h2 { font-size: 1rem; font-weight: 500; color: #f0f6fc; }
.toggles { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #c9d1d9; cursor: pointer; user-select: none; }
.toggle input { display: none; }
.toggle .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.toggle.on .dot { box-shadow: 0 0 6px 1px currentColor; }
.toggle.off { color: #484f58; }
.toggle.off .dot { opacity: 0.3; }
canvas { width: 100% !important; height: 420px !important; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 20px; }
.card-symbol { font-size: 0.8rem; color: #8b949e; margin-bottom: 4px; }
.card-price { font-size: 1.6rem; font-weight: 700; color: #f0f6fc; }
.card-change { font-size: 0.85rem; margin-top: 4px; }
.card-change.up { color: #3fb950; }
.card-change.down { color: #f85149; }
.card-detail { display: flex; gap: 24px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #21262d; font-size: 0.8rem; }
.card-detail dt { color: #8b949e; }
.card-detail dd { color: #c9d1d9; }
footer { font-size: 0.75rem; color: #484f58; padding: 0 32px 24px; }
</style>
</head>
<body>
<header>
  <h1>LP <span>Price Index</span></h1>
  <div class="time-windows" id="time-buttons">
    <button class="time-btn" data-window="7">7J</button>
    <button class="time-btn" data-window="30">1M</button>
    <button class="time-btn" data-window="90">3M</button>
    <button class="time-btn" data-window="180">6M</button>
    <button class="time-btn" data-window="365">1Y</button>
    <button class="time-btn active" data-window="all">ALL</button>
  </div>
</header>
<main>
  <p style="font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#484f58;margin-bottom:-12px;">LP Tokens</p>
  <section class="cards" id="cards"></section>

  <p style="font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#484f58;margin-bottom:-12px;">Benchmarks</p>
  <section class="cards" id="benchmark-cards"></section>

  <div class="chart-container">
    <div class="chart-header"><h2>Normalized Performance (Base 100)</h2></div>
    <div class="toggles" id="norm-toggles"></div>
    <canvas id="normalizedChart"></canvas>
  </div>

  <div class="chart-container">
    <div class="chart-header"><h2>USD Price</h2></div>
    <div class="toggles" id="price-toggles"></div>
    <canvas id="priceChart"></canvas>
  </div>
</main>
